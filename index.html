</head>

<div class="menu">
<i class="bi bi-list"></i>

      </li>
    </ol>
    
  </aside>

<!-- main -->
<main class="main-content">
  <div class="container">
  <header>
  <h1>健康看板</h1>
  <p>您好，vivi</p>
  <p>今天也一起守護長輩的健康吧!</p>
  </header>
  <div class="card-list">
    <div class="card">
      <h2>今日用藥進度</h2>
      <div class="pill-list">
        <div class="pill-1">
          早
        </div>
        <div class="pill-2">
          中
        </div>
        <div class="pill-3">
          晚
        </div>
      </div>
    </div>
    <div class="card">
      <h2>下次回診</h2>
      <p><span>3天後</span>(家醫科)</p>
    </div>
  </div>

  <section class="form-section">
    <h2>快速新增紀錄</h2>
    <form class="form-grid" action="#" method="get" enctype="multipart/form-data">
      <div class="date">
        <label for="date">紀錄日期</label>
      <input type="datetime-local" id="date" name="recordate" >
      <span class="error-msg" id="date-error"></span>
      </div>
      
      <div class="name">
        <label for="name">紀錄內容描述</label>
      <input type="text" id="name" name="description" placeholder="例如:血壓、頭痛">
      <span class="error-msg" id="name-error"></span>
      </div>

      <div class="addimg">
        <label for="addimg">點擊新增照片</label>
      <input type="file" id="addimg" name="descriptionimg" >
      </div>

      <div class="box">
        <span>頻率</span>
        <select id="frequency" name="frequency">
        <option value="frequency" selected hidden>請選擇</option>
        <option value="once">每日一次</option>
        <option value="twice">每日兩次</option>
        <option value="three meals">三餐飯後</option>
      </select>
      </div>
    <div class="box">
        <span>類型</span>
        <select id="type" name="usertype">
        <option selected hidden>請選擇</option>
        <option value="once">藥物紀錄</option>
        <option value="twice">回診記錄</option>
        <option value="three meals">醫囑記錄</option>
        <option value="three meals">健康記錄</option>
        <option value="three meals">想問醫生</option>
      </select>
      <span class="error-msg" id="type-error"></span>
    </div>
      <input class="btn-re" type="reset" value="重填">
        <input class="btn-submit" type="submit" value="儲存">
</div>
</form>
<a href="#top" class="gototop" ><i class="bi bi-arrow-up"></i></a>
</div>
</main>
<script src="./js/script.js"></script>
<script src="./js/index.js"></script>

</body>
</html>
